# Settings for the automatic updater (python -m cvtool.update).

publications:
  # OpenAlex work types never proposed for the CV.
  exclude_types: [peer-review, software, dataset, reference-entry, conference-abstract, erratum, paratext, editorial, retraction]
  # Venues whose items are abstracts rather than papers.
  exclude_venues: [Journal of Vision, BMC Neuroscience]
  # Titles matching these regexes (case-insensitive) are skipped.
  exclude_titles: ["^author response", "^decision letter", "^reviewer #"]
  # Only propose works from this year onward (older gaps are usually deliberate).
  min_year: 2020
  # Title similarity (0-1) above which two records are the same paper.
  title_match: 0.88
  # Venues (regex) that make an OpenAlex record a conference paper.
  conference_venues: ["Neural Information Processing", "Learning Representations", "Machine Learning Research", "^International Conference", "^Proceedings of the .*Conference"]
  # DBLP short venue names -> names used on the CV.
  venue_names:
    NeurIPS: Advances in Neural Information Processing Systems
    ICLR: International Conference on Learning Representations
    ICML: International Conference on Machine Learning
    AISTATS: International Conference on Artificial Intelligence and Statistics
    UAI: Conference on Uncertainty in Artificial Intelligence
    COLT: Conference on Learning Theory
    UniReps: Proceedings of Machine Learning Research (Unifying Representations in Neural Models)
    TMLR: Transactions on Machine Learning Research
    "PLoS Comput. Biol.": PLoS Computational Biology
    "Neural Comput.": Neural Computation

grants:
  # Activity codes (regex) not proposed: F = fellowships, already under Awards.
  exclude_mechanisms: "^F"
